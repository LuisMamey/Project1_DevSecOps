name: Terraform CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "~> 1.15"
  WORKING_DIR: terraform
  TF_VAR_company: ${{ vars.TF_VAR_COMPANY }}
  TF_VAR_project_name: ${{ vars.TF_VAR_PROJECT_NAME }}
  TF_VAR_service: ${{ vars.TF_VAR_SERVICE }}
  TF_VAR_environment: ${{ vars.TF_VAR_ENVIRONMENT }}
  TF_VAR_region: ${{ vars.TF_VAR_REGION }}
  TF_VAR_github_repo: ${{ vars.TF_VAR_GITHUB_REPO }}

jobs:
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --cov=lambdas --cov-report=term-missing --cov-fail-under=80

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    needs: tests
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.TF_VAR_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ env.WORKING_DIR }}
          framework: terraform
          skip_check: CKV_AWS_116,CKV_AWS_272,CKV_AWS_115,CKV_AWS_45,CKV2_AWS_16,CKV_AWS_86,CKV_AWS_87,CKV_AWS_310,CKV_AWS_158,CKV_AWS_338,CKV_AWS_374,CKV_AWS_174,CKV_AWS_305,CKV_AWS_119,CKV_AWS_173,CKV_AWS_117,CKV2_AWS_32,CKV2_AWS_42,CKV2_AWS_31,CKV2_AWS_47

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        working-directory: ${{ env.WORKING_DIR }}
        id: plan
        run: terraform plan -no-color -out=tfplan

      - name: Post Plan as PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const output = `#### Terraform Plan \n\`\`\`\n${{ steps.plan.outputs.stdout }}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Upload Terraform Plan
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: ${{ env.WORKING_DIR }}/tfplan
          retention-days: 30

      - name: Terraform Apply
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply -auto-approve

        